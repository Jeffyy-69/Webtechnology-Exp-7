<div class="container">
  <h2>Green Budget Planner App</h2>
  <p>Enter Amount that you want to Manage</p>
  <input type="number" id="amt" value="15000" min="0">
  <p>How would you like to divide your money?</p>
  Solar Energy(%) <input type="number" id="rent" value="50" min="0">
  Organic Food(%) <input type="number" id="acc" value="20" min="0">
  Recycling(%) <input type="number" id="emg" value="20" min="0">
  Saving(%) <input type="number" id="save" value="10" min="0"><br>
  <button id="btn">Evaluate My Money</button><br>
  <div class="row">
    <div class="box" id="b1"></div>
    <div class="box" id="b2"></div>
    <div class="box" id="b3"></div>
